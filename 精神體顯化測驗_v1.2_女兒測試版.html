<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>精神體顯化測驗</title><style>:root{--bg:#f5f2ec;--card:#fff;--ink:#202124;--muted:#6b6f76;--line:#ddd7cf;--accent:#24364b;--soft:#e9edf2}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;background:var(--bg);color:var(--ink)}.wrap{max-width:760px;margin:0 auto;padding:28px 18px 70px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 8px 30px rgba(0,0,0,.05)}h1{font-size:30px;margin:0 0 12px}h2{font-size:24px;margin:0 0 18px;line-height:1.45}p{line-height:1.8}.muted{color:var(--muted)}button{font:inherit}.primary{border:0;background:var(--accent);color:#fff;padding:13px 20px;border-radius:12px;font-weight:700}.ghost{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:10px}.progress{height:8px;background:#e6e1da;border-radius:999px;overflow:hidden;margin:0 0 18px}.bar{height:100%;background:var(--accent)}.option{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;padding:14px 15px;margin:10px 0;border-radius:12px;line-height:1.55}.option:hover{background:var(--soft)}.big{font-size:38px;font-weight:800;margin:6px 0 4px}.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--soft);margin:3px 5px 3px 0;font-size:13px}.metric{border-top:1px solid var(--line);padding:10px 0;display:flex;justify-content:space-between}.debug{margin-top:22px;padding:14px;background:#111;color:#e7e7e7;border-radius:12px;font:12px/1.6 ui-monospace,Menlo,monospace;white-space:pre-wrap;overflow:auto}@media(max-width:600px){.card{padding:20px}h1{font-size:26px}h2{font-size:21px}}</style></head><body><main class="wrap"><div id="app">
  <div class="card" id="static-intro">
    <h1>精神體顯化測驗</h1>
    <p>如果一個人的穩定行為模式真的會顯化成一種動物，它最可能是哪一種？</p>
    <p class="muted">32題核心題＋必要時自動加入鑑別題。作答途中不顯示動物傾向，也不使用你喜歡的動物、MBTI或其他個人資料。</p>
    <button class="primary" onclick="start()">開始測驗</button>
    <p class="muted" style="font-size:13px;margin-top:16px">題目中的情境限制是判定的一部分，請依照題目給定的條件作答，不要自行增加未提到的前提。</p>
  </div>
</div></main><script>const QUESTIONS=[{"id": 1, "stem": "你得到一段完整的自由時間。沒有工作、沒有家庭責任、沒有人等你，也沒有任何事情必須完成。你所在的地方安全、舒適，資源充足。附近同時有幾個你從未去過、但確認安全的地方。去不去完全不影響你的生活。", "options": {"A": "會想去看看。即使沒有目的，「沒去過」本身就足以讓我產生興趣。", "B": "如果其中某個地方看起來有有趣的東西，我可能會去研究一下；純粹換地方本身吸引力不大。", "C": "看當下心情。", "D": "原本的地方已經舒服，我通常不會特地離開；除非後來出現具體理由。", "E": "我會很自然地待在熟悉、舒服的範圍，而且長時間如此也不會覺得受限。"}}, {"id": 2, "stem": "你在一個固定使用很久的空間裡，有自己的位置和物品。某天開始，另一個人也需要長期使用這個空間。對方很有禮貌，不碰你的東西、不製造噪音，也尊重你的習慣。", "options": {"A": "只要彼此尊重，很快就能適應共同使用。", "B": "可以接受，但希望雙方有清楚區域。", "C": "即使完全沒有冒犯，仍比較喜歡只有自己的狀態。", "D": "先長期觀察對方是否可靠。", "E": "開始評估其他能重新擁有完整私人空間的位置。"}}, {"id": 3, "stem": "你和幾個可靠的人一起完成事情。目前每個人都知道自己要做什麼，而且運作正常。", "options": {"A": "做好自己的部分即可。", "B": "即使正常，仍自然留意整體是否逐漸偏離目標。", "C": "比較留意誰累了、卡住了、需要幫助。", "D": "注意是否存在尚未察覺的風險。", "E": "喜歡大家各自可靠完成，最後再會合。"}}, {"id": 4, "stem": "你獨自在陌生但安全的地方待幾個小時，沒有任務。", "options": {"A": "四處走走，把能到的地方看一遍。", "B": "找舒服位置，有需要再移動。", "C": "先弄清楚出口、配置和安靜位置。", "D": "注意沒見過、有意思的東西。", "E": "找到合適位置後安定下來。"}}, {"id": 5, "stem": "和熟悉可靠的人自由相處一整天。", "options": {"A": "大家一起活動最好。", "B": "大部分一起，中間自己離開再回來。", "C": "只和最親近的一個人相處。", "D": "各做各的，知道彼此在即可。", "E": "想真正離開群體，取得完整獨處。"}}, {"id": 6, "stem": "非常重視的人受到尚不明朗的威脅。", "options": {"A": "先把對方帶離現場。", "B": "先判斷威脅來源與程度。", "C": "直接站到對方與威脅之間。", "D": "找其他可靠的人一起處理。", "E": "先確認對方是否需要協助。"}}, {"id": 7, "stem": "熟悉場所突然改變規則，讓原流程變麻煩。", "options": {"A": "很快換方法。", "B": "研究新規則，找最高效率做法。", "C": "盡量維持原流程。", "D": "先適應觀察。", "E": "如果其他地方能維持原方式，考慮換地方。"}}, {"id": 8, "stem": "得到安全、無價值、目前用不到的陌生裝置。", "options": {"A": "主動研究它是什麼。", "B": "直接操作、試不同方法。", "C": "稍微看一下，看不懂就放著。", "D": "用不到就不研究。", "E": "收起來，需要時再研究。"}}, {"id": 9, "stem": "熟人之間發生與你無關的小衝突。", "options": {"A": "注意事情發展但不一定介入。", "B": "看得出解法就指出關鍵。", "C": "不影響整體或自己就讓他們處理。", "D": "注意是否有人受到委屈。", "E": "自然離衝突遠一點。"}}, {"id": 10, "stem": "長期使用的地方反覆出現小干擾，你可以要求停止，也可以低成本換地方。", "options": {"A": "處理干擾源，恢復原狀。", "B": "把干擾隔開。", "C": "先觀察。", "D": "如果換地方成本不高，寧可重新找安靜位置。", "E": "還能使用就不特別處理。"}}, {"id": 11, "stem": "與最親近的人長期分開生活，但關係完全穩定。", "options": {"A": "仍希望經常聯絡、知道彼此狀況。", "B": "不需一直聯絡，但需要固定穩定節奏。", "C": "各自生活沒問題，重要時刻會合即可。", "D": "關係重要但不需一直確認。", "E": "不喜歡長期分離，會想改變安排重新靠近。"}}, {"id": 12, "stem": "重要事情做到一半，原方法突然失效，今天必須完成。", "options": {"A": "立刻換方法。", "B": "找出失效環節再修正。", "C": "直接試不同方法。", "D": "先理解新情況與原理。", "E": "重新評估是否值得今天硬做。"}}, {"id": 13, "stem": "加入友善但彼此已熟悉的小團體。", "options": {"A": "慢慢融入整個團體。", "B": "和其中一兩個建立很深關係。", "C": "可以合作但不需要成為圈內人。", "D": "自然在不同人際組合之間流動。", "E": "大家再友善也仍比較喜歡自己的生活。"}}, {"id": 14, "stem": "可信任的人未經詢問重新整理你的私人空間，而且客觀上可能更有效率。", "options": {"A": "好用就接受。", "B": "實際使用後決定。", "C": "不舒服，因為沒有先詢問。", "D": "直接恢復原配置。", "E": "信任下降，重新評估對方能否進入私人範圍。"}}, {"id": 15, "stem": "同行者說前方似乎不對勁，但沒有明確危險。", "options": {"A": "停下觀察。", "B": "先確認同行者安全。", "C": "找最適合的人負責判斷。", "D": "先拉開距離或換路。", "E": "照原計畫但提高注意。"}}, {"id": 16, "stem": "不屬於你責任的事情出問題，你十分鐘能解決，真正負責的人也有能力處理。", "options": {"A": "直接解決。", "B": "告知問題與解法。", "C": "影響自己或整體才介入。", "D": "不介入。", "E": "不接手但持續注意是否解決。"}}, {"id": 17, "stem": "突然擁有很強的力量，但不需要靠它取得安全、金錢或地位。", "options": {"A": "建立合理秩序。", "B": "有人越界時讓對方停止即可。", "C": "保護重要的人。", "D": "保留力量，主要希望不被干涉。", "E": "用力量取得更大的行動自由。"}}, {"id": 18, "stem": "熟悉舒服的居住地與全新但條件完全相同的地方，搬遷零成本。", "options": {"A": "願意換環境。", "B": "比較後決定。", "C": "無明顯偏好。", "D": "沒理由就不搬。", "E": "熟悉本身具有不可替代價值。"}}, {"id": 19, "stem": "重要的人明知故犯你們的重要約定，但沒有造成實際損失，願意道歉。", "options": {"A": "確認原因與修正後慢慢恢復。", "B": "維持關係但重新建立信任。", "C": "理解動機後決定。", "D": "看是否碰核心底線。", "E": "很可能直接結束關係。"}}, {"id": 20, "stem": "親近的人開始和原圈子之外的人建立同等深厚關係。", "options": {"A": "很正常。", "B": "不影響原關係就不在意。", "C": "願意認識新圈子。", "D": "注意是否改變原圈子結構。", "E": "對高度親密關係的分散感到不舒服。"}}, {"id": 21, "stem": "穩定流程有一個可以改善的小地方，目前沒有問題。", "options": {"A": "馬上想改善。", "B": "確認實質差異才改。", "C": "有空可能試。", "D": "穩定有效就不改。", "E": "真出問題才改。"}}, {"id": 22, "stem": "舒服熟悉的地方突然有無害陌生人長時間待在附近。", "options": {"A": "不受影響。", "B": "觀察後放鬆。", "C": "希望保持更大距離。", "D": "注意出口與動向。", "E": "有同樣舒服而沒人的地方就直接換過去。"}}, {"id": 23, "stem": "非常重視的人長期低潮，但沒有立即危險或具體事情需要處理。", "options": {"A": "持續主動照看。", "B": "讓對方知道自己一直在，需要時可以找。", "C": "安排事情陪她走出狀態。", "D": "依對方反應調整照護方式。", "E": "除非明確求助，否則不持續介入。"}}, {"id": 24, "stem": "熟悉環境出現沒有實際影響的細微異常。", "options": {"A": "想弄清楚原因。", "B": "記住並觀察是否再出現。", "C": "涉及安全才確認。", "D": "沒實際影響就忽略。", "E": "直接調整回熟悉狀態。"}}, {"id": 25, "stem": "共同工作中你已完成自己的部分，另一人進度落後但尚未影響期限。", "options": {"A": "主動協助。", "B": "確認是否需要幫助。", "C": "提醒進度。", "D": "不接手。", "E": "持續監控，真正偏離目標才介入。"}}, {"id": 26, "stem": "原本預留整天的事情上午全部完成。", "options": {"A": "找其他可以改善或完成的事。", "B": "找積欠事項完成。", "C": "做沒有成果要求的興趣。", "D": "直接休息。", "E": "做或不做都可以。"}}, {"id": 27, "stem": "獨自在陌生城市三天，基本需求全部安排好。", "options": {"A": "主動往更遠地方探索。", "B": "只去真正感興趣的地方。", "C": "維持住宿附近活動。", "D": "可以大部分時間待在住宿處。", "E": "先弄熟周圍再決定。"}}, {"id": 28, "stem": "與重要的人嚴重爭執，但沒有背叛或踩核心底線。", "options": {"A": "當下講清楚。", "B": "離開冷靜後再談。", "C": "找出真正原因。", "D": "停止互動，等對方能合理溝通。", "E": "開始重新評估關係是否值得維持。"}}, {"id": 29, "stem": "與可靠的人長期合作，成果相同。", "options": {"A": "大部分時間一起進行。", "B": "共同確認方向，再分工。", "C": "各自完成，最後整合。", "D": "依能力彈性主導。", "E": "如果一個人能完成，不一定需要形成長期合作。"}}, {"id": 30, "stem": "熟悉生活環境未來半年會持續變麻煩，但仍安全；另一地方條件相近。", "options": {"A": "留下來調整原環境。", "B": "先調整，真的持續不舒服再搬。", "C": "直接搬。", "D": "計算兩邊總成本。", "E": "先試住新地方再決定。"}}, {"id": 31, "stem": "小團體突然需要快速決定，你最先看懂問題，但不是最資深的人。", "options": {"A": "直接提出做法讓大家動起來。", "B": "提供關鍵資訊，大家共同決定。", "C": "找最適合決定的人，由她決定。", "D": "沒人處理才出手。", "E": "只處理自己受影響部分。"}}, {"id": 32, "stem": "人生進入多年完全自由、沒有責任與壓力的穩定期。", "options": {"A": "穩定小群體一直存在於日常。", "B": "有一個最重要的人即可。", "C": "固定自己的生活，大部分獨處，偶爾為真正有興趣的事情出去。", "D": "接觸不同人、地方與事物，維持變化。", "E": "有安靜自己的生活，但仍自然找值得研究、改善或完成的事情。"}}];

const DIM_NAMES={S1:'社交需求',S2:'固定群體需求',T:'邊界需求',V:'警戒',Xn:'新奇探索',Xu:'目的探索',B:'選擇性依附',M:'移動性',A:'策略適應',D:'目標監控'};
const DIMS=Object.keys(DIM_NAMES),OPTS='ABCDE',WEIGHTS={S1:1.25,S2:1,T:1.25,V:1,Xn:.85,Xu:.85,B:1.25,M:1,A:1,D:1.25};
let state={stage:'intro',i:0,answers:{},diffAnswers:{},diffQueue:[],diffScores:{},result:null}; const debug=new URLSearchParams(location.search).get('debug')==='1';
function el(x){document.getElementById('app').innerHTML=x} function start(){state.stage='core';state.i=0;render()} function back(){if(state.i>0)state.i--;render()}
function choose(o){if(state.stage==='core'){state.answers[QUESTIONS[state.i].id]=o;if(state.i<31)state.i++;else finishCore()}else{const q=state.diffQueue[state.i];state.diffAnswers[q.id]=o;applyDiff(q,o);if(shouldStopDiff()||state.i>=state.diffQueue.length-1)finishAll();else state.i++}render()}
function profile(){const v={};for(const d of DIMS){const vals=[];for(const [q,a] of Object.entries(DIM_RATINGS[d])){const x=state.answers[q];if(x)vals.push(a[OPTS.indexOf(x)])}v[d]=vals.length?vals.reduce((x,y)=>x+y,0)/vals.length:2}return v}
function dist(v,p){return DIMS.reduce((s,d)=>s+WEIGHTS[d]*Math.abs(v[d]-Number(p.vector[d])),0)}
function eligible(n,v,a){switch(n){case'雪豹':return v.S1<=1.7&&(a[10]==='D'||a[15]==='D'||a[22]==='E'||a[17]==='D');case'虎':return v.T>=2.6;case'家貓':return v.S1<=2.2&&v.B>=2.2&&a[2]!=='E';case'美洲黑熊':return v.S1<=1.7&&v.V>=2.2;case'普通袋熊':return v.S1<=1.7&&v.M<=2.2&&v.Xn<=2.1&&(a[18]==='E'||a[30]==='B');case'灰狼':return v.S1>=2.8&&v.S2>=2.8;case'亞洲雌象':return v.S1>=2.7&&v.B>=3;case'Resident虎鯨':return v.S1>=2.8&&v.S2>=2.7&&v.B>=3;case'馬':return v.S1>=2.5&&v.V>=3;case'狐獴':return v.S1>=2.7&&v.S2>=2.4&&v.V>=3;case'倭黑猩猩':return v.S1>=2.7&&v.S2<=1.8;case'寬吻海豚':return v.S1>=2.7&&v.S2<=1.5&&v.A>=3;case'草原田鼠':return v.B>=3.1&&(a[11]==='A'||a[20]==='E');case'黑腳信天翁':return v.B>=3.1&&v.M>=2.5;case'邊境牧羊犬':return v.D>=3.1&&(a[3]==='B'||a[21]==='A'||a[32]==='E');case'德國牧羊犬':return v.V>=3&&v.B>=2.5&&(a[6]==='C'||a[16]==='A'||a[16]==='B');case'郊狼':return v.A>=3.4&&(a[7]==='A'||a[12]==='A'||a[30]==='C');case'渡鴉':return v.Xn>=3&&v.Xu>=3;case'浣熊':return v.Xu>=3&&a[8]==='B'&&v.Xn>=2;case'歐洲兔':return v.V>=3&&v.S1>=2.3;default:return true}}
function support(n,v,a){let s=0;const y=(q,o,k=1)=>{if(a[q]===o)s+=k};switch(n){case'邊境牧羊犬':y(3,'B',2);y(21,'A',2);y(32,'E',2);y(24,'B');y(12,'D');break;case'雪豹':y(5,'E',2);y(10,'D',2);y(15,'D',2);y(17,'D',2);y(22,'E',2);y(13,'E');break;case'普通袋熊':y(18,'E',3);y(1,'D');y(27,'D',2);y(30,'B',2);y(22,'E');break;case'草原田鼠':y(11,'A',2);y(19,'E',2);y(20,'E',3);break;case'家貓':y(2,'A',2);y(2,'B');y(14,'C',2);break;case'美洲黑熊':y(15,'D');y(24,'B');y(30,'B');break;case'德國牧羊犬':y(6,'C',2);y(16,'A',2);y(16,'B');break;case'郊狼':y(7,'A',2);y(12,'A',2);y(30,'C',2);break;case'渡鴉':y(1,'A',2);y(8,'A',2);break;case'浣熊':y(8,'B',3)}return s}
function rankCore(){const v=profile();let all=PROTOTYPES.map(p=>({...p,dist:dist(v,p),eligible:eligible(p.name,v,state.answers),support:support(p.name,v,state.answers)}));let live=all.filter(x=>x.eligible);if(live.length<5)live=all;live.sort((a,b)=>(b.support-a.support)||(a.dist-b.dist));return{v,all,live}}
function finishCore(){const r=rankCore(),top=r.live.slice(0,5),mods=[];const add=(k,p)=>{if(!mods.some(x=>x[0]===k))mods.push([k,p])};if(r.v.D>=2.8&&r.v.S1<=2.0&&(r.v.M<=2.6||r.v.Xn<=2.4))add('D10',99);if(r.v.B>=3.0&&r.v.S1<=2.0)add('D11',90);for(const[k,m]of Object.entries(DIFF_MODULES)){const hits=m.pair.filter(x=>top.slice(0,4).some(c=>c.name===x)).length;if(hits>=2)add(k,hits)}mods.sort((a,b)=>b[1]-a[1]);const q=[];for(const[k]of mods)for(const x of DIFF_MODULES[k].questions)if(!q.some(z=>z.id===x.id))q.push(x);state.diffQueue=q.slice(0,6);state.diffScores={};PROTOTYPES.forEach(c=>state.diffScores[c.name]=0);state.coreRank=r;if(q.length){state.stage='diff';state.i=0}else finishAll()}
function applyDiff(q,o){for(const[n,x]of Object.entries(q.options[o].score||{}))state.diffScores[n]=(state.diffScores[n]||0)+Number(x)}
function shouldStopDiff(){return false}
function finishAll(){let base=(state.coreRank||rankCore()).live.slice(0,8);base.sort((a,b)=>((state.diffScores[b.name]||0)-(state.diffScores[a.name]||0))||(b.support-a.support)||(a.dist-b.dist));state.result={rank:base,v:(state.coreRank||rankCore()).v};state.stage='result';state.i=0}
function level(x){return x<.8?'很低':x<1.6?'低':x<2.4?'中':x<3.2?'高':'很高'}
function render(){if(state.stage==='intro'){el('<div class="card"><h1>精神體顯化測驗</h1><p>如果一個人的穩定行為模式真的會顯化成一種動物，它最可能是哪一種？</p><p class="muted">32題核心題＋必要時自動加入鑑別題。作答途中不顯示動物傾向，也不使用你喜歡的動物、MBTI或其他個人資料。</p><button class="primary" onclick="start()">開始測驗</button></div>');return}if(state.stage==='core'||state.stage==='diff'){const core=state.stage==='core',q=core?QUESTIONS[state.i]:state.diffQueue[state.i],total=core?32:state.diffQueue.length,cur=state.i+1,opts=OPTS.split('').map(o=>'<button class="option" onclick="choose(\''+o+'\')"><b>'+o+'</b>　'+(q.options[o].text||q.options[o])+'</button>').join('');el('<div class="card"><div class="progress"><div class="bar" style="width:'+(cur/total*100)+'%"></div></div><div class="muted">'+(core?'核心題':'鑑別題')+' '+cur+' / '+total+'</div><h2>'+q.stem+'</h2>'+opts+(state.i>0?'<button class="ghost" onclick="back()">← 上一題</button>':'')+'</div>');return}const r=state.result,a=r.rank[0],b=r.rank[1],c=r.rank[2];const metrics=DIMS.map(d=>'<div class="metric"><span>'+DIM_NAMES[d]+'</span><b>'+level(r.v[d])+'</b></div>').join('');let dbg='';if(debug)dbg='<div class="debug">DIMENSIONS\n'+JSON.stringify(r.v,null,2)+'\n\nCORE RANK\n'+JSON.stringify(state.coreRank.live.slice(0,8).map(x=>({name:x.name,dist:+x.dist.toFixed(2),support:x.support,eligible:x.eligible})),null,2)+'\n\nDIFF SCORES\n'+JSON.stringify(state.diffScores,null,2)+'</div>';el('<div class="card"><div class="muted">你的精神體</div><div class="big">'+a.name+'</div><div class="tag">'+a.archetype+'</div><p><b>第二近型：</b>'+(b?.name||'—')+'　　<b>第三近型：</b>'+(c?.name||'—')+'</p><h2 style="margin-top:28px">行為輪廓</h2>'+metrics+'<h2 style="margin-top:28px">為什麼是它</h2><p>'+a.need+'</p><p class="muted">v1.2 校準版：完整情境題、必要條件與動態鑑別；人格投射／世界觀娛樂，不是心理診斷。</p><button class="ghost" onclick="location.reload()">重新測驗</button>'+dbg+'</div>')}
render();
</script></body></html>
